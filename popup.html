<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 300px; padding: 15px; font-family: Arial, sans-serif; margin: 0; }
    h3 { margin: 0 0 10px 0; color: #333; }
    .status { padding: 10px; border-radius: 5px; margin-bottom: 10px; font-size: 13px; }
    .status.ok { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #721c24; }
    .status.warning { background: #fff3cd; color: #856404; }
    button { width: 100%; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; margin-bottom: 8px; transition: 0.2s; }
    .btn-primary { background: #4CAF50; color: white; }
    .btn-primary:hover { background: #45a049; }
    .btn-primary:disabled { background: #a5d6a7; cursor: not-allowed; }
    .btn-secondary { background: #2196F3; color: white; }
    .btn-secondary:hover { background: #1976D2; }
    .btn-danger { background: #f44336; color: white; }
    .btn-danger:hover { background: #e53935; }
    .info { font-size: 12px; color: #666; margin-top: 10px; line-height: 1.5; }
    .divider { border-top: 1px solid #eee; margin: 10px 0; }
  </style>
</head>
<body>
  <h3>🎓 НМО Автоответчик</h3>
  
  <div id="status" class="status">Загрузка...</div>
  
  <button id="btnAnswer" class="btn-primary">✅ Ответить на текущий</button>
  
  <div class="divider"></div>
  
  <button id="btnAuto" class="btn-secondary">🤖 Авто режим</button>
  <button id="btnStop" class="btn-danger" style="display:none;">⏹ Остановить авто</button>
  
  <div class="divider"></div>
  
  <button id="btnParse" class="btn-secondary">📄 Парсить страницу с ответами</button>
  
  <div class="info">
    <p><b>Инструкция:</b></p>
    <p>1. Откройте страницу с ответами на РосМедИнфо</p>
    <p>2. Нажмите "Парсить текущую страницу"</p>
    <p>3. Откройте страницу теста</p>
    <p>4. "Ответить на текущий" — один раз</p>
    <p>5. "Авто режим" — отвечает и переходит сам</p>
    <p>6. "Остановить авто" — прерывает цикл</p>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
